# ─────────────────────────────────────────────────────────────────────────────
# Resilience Test: POD_KILL — Hard Broker Crash (SIGKILL)
# ─────────────────────────────────────────────────────────────────────────────
# Simulates a kernel panic or OOM kill. The broker receives no SIGTERM and has
# no time to flush logs or transfer partition leadership before termination.
#
# Hypothesis:
#   Leader re-election completes within 15s (controller.quorum.fetch.timeout.ms).
#   Idempotent producer with acks=all stalls, then retries successfully.
#   ISR recovers to 3/3 within 120s. Zero data loss.
#
# Pass criteria (SLA):
#   - maxRtoMs: 30000        (cluster resumes writes within 30s)
#   - maxRpoMs: 0            (zero committed message loss)
#   - maxP99LatencyMs: 30000 (30s spike tolerated during re-election)
#
# Usage:
#   kates resilience run -f cli/examples/resilience-pod-kill.yaml
# ─────────────────────────────────────────────────────────────────────────────

testRequest:
  type: LOAD
  spec:
    topic: kates-events
    partitions: 6
    replicationFactor: 3
    minInsyncReplicas: 2
    numRecords: 500000
    recordSize: 1024
    throughput: 5000
    numProducers: 3
    numConsumers: 2
    consumerGroup: resilience-pod-kill-cg
    acks: "all"
    enableIdempotence: true
    batchSize: 65536
    lingerMs: 5
    compressionType: lz4

chaosSpec:
  experimentName: broker-hard-crash
  disruptionType: POD_KILL
  targetNamespace: kafka
  targetLabel: "strimzi.io/pool-name=brokers-alpha"
  chaosDurationSec: 30      # kill window — Kubernetes restarts the pod
  delayBeforeSec: 0
  gracePeriodSec: 0         # SIGKILL — no graceful shutdown

steadyStateSec: 30
maxRecoveryWaitSec: 120

probes:
  - name: isr-health-check
    type: cmdProbe
    mode: Continuous
    command: "kafka-topics.sh --bootstrap-server localhost:9092 --describe --under-replicated-partitions 2>/dev/null | grep -c 'Topic:' || echo '0'"
    expectedOutput: "50"
    comparator: "<="
    intervalSec: 10
    timeoutSec: 30

  - name: cluster-ready
    type: k8sProbe
    mode: Edge
    command: "kafka Ready"
    expectedOutput: "Ready"
    comparator: contains
    intervalSec: 15
    timeoutSec: 30
